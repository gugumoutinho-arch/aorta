name: Verificar o site

# Em pull requests. No envio para main, a mesma verificação roda dentro de "Publicar o site", antes de publicar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/package-lock.json
      - name: Instalar dependências do site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências das verificações
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar o site (build, regras, CSS, HTML, telas e acessibilidade)
        working-directory: tools
        run: npm run check
      - name: Guardar capturas de tela e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-do-site
          path: tools/reports
          retention-days: 14
