name: Verificar o site

# Em pull requests. No envio para main, "Publicar o site" ainda roda só o check; levar testes, fluxos, acervos e
# Lighthouse para lá (ou exigir PR na main) é pendência da próxima atualização da main, que depende do dono.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/package-lock.json
      - name: Instalar dependências do site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências das verificações
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes de unidade (lógica pura e contratos das medições)
        working-directory: tools
        run: npm test
      - name: Verificar o site (build, regras, codificação, CSS, HTML, telas e acessibilidade)
        working-directory: tools
        run: npm run check
      - name: Fluxos (busca, ficha, filtros, edição; dados fictícios)
        if: success() || failure()
        working-directory: tools
        run: npm run flows
      - name: Acervos (coração e corpo, interrupções, movimento reduzido)
        if: success() || failure()
        working-directory: tools
        run: npm run acervos
      - name: Abas de assunto (Todos, assuntos, Casos clínicos, endereços e celular)
        if: success() || failure()
        working-directory: tools
        run: npm run topics
      - name: Gravar assuntos e ligações (criar, ligar, desligar, remover e desfazer)
        if: success() || failure()
        working-directory: tools
        run: npm run topic-edit
      - name: Lighthouse (reprova abaixo dos limites de tools/gates.mjs)
        if: success() || failure()
        working-directory: tools
        run: npm run lighthouse
      - name: Guardar capturas de tela e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-do-site
          path: tools/reports
          retention-days: 14
